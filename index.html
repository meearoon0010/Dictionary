<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>말कोश — Korean · Nepali Dictionary</title>
  <style>
    :root{--bg:#f5f7fb;--surface:#fff;--ink:#162033;--muted:#68758d;--line:#e3e9f2;--brand:#4f46e5;--blue:#086bd6;--red:#dc3e4b;--shadow:0 14px 38px #21346415}.dark{--bg:#10131a;--surface:#191e29;--ink:#eff3ff;--muted:#a4adc0;--line:#30394c;--brand:#a39cff;--blue:#61b1ff;--red:#ff7f87;--shadow:0 14px 38px #0006}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Noto Sans KR","Noto Sans Devanagari",sans-serif}.shell{max-width:970px;margin:auto;padding:30px 18px 64px}header{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:24px}.brand{font-size:25px;font-weight:850;letter-spacing:-.7px}.brand span{color:var(--brand)}.small{font-size:13px;font-weight:500;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}button,.import{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer}.hero,.card,.empty{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px}.hero{padding:27px}.hero h1{margin:0;font-size:27px;letter-spacing:-.7px}.hint{color:var(--muted);margin:4px 0 18px}.search{display:flex;gap:8px;background:var(--bg);border:1px solid var(--line);padding:7px;border-radius:13px}.search input{min-width:0;flex:1;padding:7px;border:0;outline:0;background:transparent;color:var(--ink);font:inherit}.search select{background:transparent;color:var(--ink);border:0;border-left:1px solid var(--line);padding-left:10px;font:inherit}.tabs{display:flex;gap:8px;margin:20px 0 14px}.tabs button.active,.primary{background:var(--brand);border-color:var(--brand);color:#fff}.card{padding:19px;margin:0 0 12px}.entry-top{display:flex;justify-content:space-between;gap:14px}.word{font-weight:800;font-size:24px}.nepali{font-size:20px;margin-top:3px}.pron{font-size:13px;color:var(--muted);margin-top:8px}.star,.sound{border:0;background:transparent;padding:3px 7px;font-size:20px}.star.on{color:#f5b401}.relations{display:flex;flex-wrap:wrap;gap:7px;margin-top:15px}.tag{font-size:13px;padding:4px 9px;border-radius:999px;color:var(--blue);background:color-mix(in srgb,var(--blue) 11%,transparent)}.tag.opposite{color:var(--red);background:color-mix(in srgb,var(--red) 11%,transparent)}.empty{text-align:center;padding:38px;color:var(--muted)}dialog{width:calc(100% - 28px);max-width:510px;padding:0;border:0;border-radius:18px;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px #0008}dialog::backdrop{background:#0008}.form{padding:23px}.form h2{margin:0 0 12px}.form label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}.form input{width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit}.form-actions{display:flex;justify-content:end;gap:8px;margin-top:17px}.import input{display:none}@media(max-width:560px){header{align-items:flex-start;flex-direction:column}.hero{padding:20px}.search{flex-wrap:wrap}.search select{width:100%;border-left:0;border-top:1px solid var(--line);padding:8px}}
  </style>
</head>
<body><div class="shell">
  <header><div class="brand">말<span>कोश</span> <span class="small">Korean · Nepali Dictionary</span></div><div class="actions"><button id="add">＋ Add word</button><button id="theme" title="Toggle dark mode">◐</button></div></header>
  <section class="hero"><h1>Find the word you need.</h1><p class="hint">Search Korean or Nepali · Press the speaker to hear Korean pronunciation.</p><div class="search"><input id="query" autofocus placeholder="한국어 또는 नेपालीमा खोज्नुहोस्"><select id="direction"><option value="all">Korean ↔ Nepali</option><option value="ko">Korean → Nepali</option><option value="ne">Nepali → Korean</option></select></div></section>
  <main><div class="tabs"><button class="active" data-view="all">All words</button><button data-view="fav">★ Favourites</button></div><div id="results"></div></main>
</div><dialog id="editor"><form class="form" id="wordForm"><h2>Add a word</h2><label>Korean</label><input name="ko" required placeholder="예: 사랑"><label>Nepali</label><input name="ne" required placeholder="उदाहरण: प्रेम"><label>Romanised pronunciation</label><input name="pron" placeholder="sarang"><label>Similar words (comma separated)</label><input name="similar" placeholder="애정, 좋아하다"><label>Opposite words (comma separated)</label><input name="opposite" placeholder="미움"><div class="form-actions"><button type="button" id="cancel">Cancel</button><button class="primary">Save word</button></div></form></dialog>
<script src="dictionary-data.js"></script><script>
  const stored=JSON.parse(localStorage.getItem('malkosh-custom')||'[]'),words=[...stored,...DICTIONARY_DATA],favs=new Set(JSON.parse(localStorage.getItem('malkosh-favs')||'[]'));let view='all';const q=document.querySelector('#query'),box=document.querySelector('#results');
  const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); const save=()=>localStorage.setItem('malkosh-favs',JSON.stringify([...favs]));
  function speak(word){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(word);u.lang='ko-KR';speechSynthesis.speak(u)}
  function render(){let term=q.value.trim().toLowerCase(),dir=document.querySelector('#direction').value;let list=words.filter((w,i)=>{let korean=w.ko.toLowerCase().includes(term),nepali=w.ne.toLowerCase().includes(term),pron=(w.pron||'').toLowerCase().includes(term);return (!term||korean||nepali||pron)&&(dir==='all'||(dir==='ko'&&korean)||(dir==='ne'&&(nepali||pron)))&&(view==='all'||favs.has(i))});box.innerHTML=list.length?list.map(w=>{let i=words.indexOf(w);return `<article class="card"><div class="entry-top"><div><div class="word">${esc(w.ko)} <button class="sound" onclick="speak(${JSON.stringify(w.ko)})" aria-label="Hear ${esc(w.ko)}">🔊</button></div><div class="nepali">${esc(w.ne)}</div>${w.pron?`<div class="pron">${esc(w.pron)}</div>`:''}</div><button class="star ${favs.has(i)?'on':''}" onclick="fav(${i})" aria-label="Favourite">${favs.has(i)?'★':'☆'}</button></div>${(w.similar?.length||w.opposite?.length)?`<div class="relations">${(w.similar||[]).map(x=>`<span class="tag">Similar · ${esc(x)}</span>`).join('')}${(w.opposite||[]).map(x=>`<span class="tag opposite">Opposite · ${esc(x)}</span>`).join('')}</div>`:''}</article>`}).join(''):`<div class="empty">${view==='fav'?'No favourite words yet.':'No matching word found.'}</div>`}
  window.speak=speak;window.fav=i=>{favs.has(i)?favs.delete(i):favs.add(i);save();render()};q.addEventListener('input',render);document.querySelector('#direction').addEventListener('change',render);document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));render()});
  const editor=document.querySelector('#editor');document.querySelector('#add').onclick=()=>editor.showModal();document.querySelector('#cancel').onclick=()=>editor.close();document.querySelector('#wordForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),custom={ko:f.get('ko'),ne:f.get('ne'),pron:f.get('pron'),similar:f.get('similar').split(',').map(x=>x.trim()).filter(Boolean),opposite:f.get('opposite').split(',').map(x=>x.trim()).filter(Boolean)};stored.unshift(custom);localStorage.setItem('malkosh-custom',JSON.stringify(stored));words.unshift(custom);e.target.reset();editor.close();render()};document.querySelector('#theme').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('malkosh-dark',document.body.classList.contains('dark'))};if(localStorage.getItem('malkosh-dark')==='true')document.body.classList.add('dark');render();
</script></body></html>
